<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grover, One Door at a Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="shared.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <nav>
        <a href="index.html" aria-current="page">Chapters</a>
        <a href="flashcards.html">Flashcards</a>
        <a href="demo.html" class="nav-demo">Demo</a>
      </nav>
      <div class="size-controls" aria-label="Display">
        <button data-theme-toggle aria-label="Switch theme">☾</button>
        <button data-size="-1" aria-label="Smaller text">A−</button>
        <button data-size="1" aria-label="Larger text">A+</button>
      </div>
    </header>

    <h1>Grover, one door at a time</h1>
    <p class="lede">Building Grover's search algorithm in Cirq, one idea per chapter. Each chapter matches a Python file in the repo.</p>

    <a class="demo-callout" href="demo.html">
      <div><b>Try the demo</b><span>Factor an RSA-shaped number with Grover, one step at a time. Every bar is a Cirq amplitude.</span></div>
      <span class="go" aria-hidden="true">→</span>
    </a>

    <h2 class="roadmap-head">Roadmap</h2>
    <ol id="roadmap" class="roadmap"></ol>

    <h2 class="roadmap-head">Chapters</h2>
    <div id="chapters"></div>
    <footer class="stamp" id="build-stamp"></footer>
  </div>

  <script src="data/chapters.js"></script>
  <script>
    const ICON = { done: "⭐", locked: "🔒" };
    const icon = (st) => ICON[st] || "✏️";

    const map = document.getElementById("roadmap");
    for (const ch of window.CHAPTERS) {
      const li = document.createElement("li");
      li.className = "road " + ch.status.replace(" ", "-");
      li.innerHTML =
        `<span class="num">${ch.num}</span>` +
        `<span class="road-main"><b>${ch.title}</b>` +
        `<span class="road-one">${ch.oneLine || ""}</span></span>` +
        `<span class="status">${icon(ch.status)}</span>`;
      li.addEventListener("click", () => {
        const d = document.getElementById("ch-" + ch.num);
        if (!d) return;
        d.open = true;
        d.scrollIntoView({ behavior: "smooth", block: "start" });
      });
      map.appendChild(li);
    }

    const root = document.getElementById("chapters");
    for (const ch of window.CHAPTERS) {
      const d = document.createElement("details");
      d.className = "chapter" + (ch.status === "locked" ? " locked" : "");
      d.id = "ch-" + ch.num;
      const s = document.createElement("summary");
      s.innerHTML = `<span class="num">${ch.num}</span><span>${ch.title}</span><span class="status">${icon(ch.status)}</span>`;
      d.appendChild(s);
      if (ch.body) {
        const b = document.createElement("div");
        b.className = "body";
        b.innerHTML = `<p class="hint">Code: <code>${ch.file}</code></p>` + ch.body;
        d.appendChild(b);
      } else {
        s.addEventListener("click", (e) => e.preventDefault());
      }
      root.appendChild(d);
    }
  </script>
</body>
</html>
